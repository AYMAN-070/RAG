[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate",
    "bm25s",
    "fire",
    "mypy",
    "pydantic",
    "torch",
    "tqdm",
    "transformers",
]

# --- LE CODE MAGIQUE POUR FORCER LE GPU NVIDIA ---
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[tool.mypy]
# Ignore les librairies externes qui n'ont pas de "type hints"
ignore_missing_imports = true
mypy_path = "src"
explicit_package_bases = true